apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod3
  namespace: fanout
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  shard: kargo-mac1
  requestedFreight:
    - origin:
        kind: Warehouse
        name: fanout
      sources:
        availabilityStrategy: All
        stages:
          - staging1
          - staging2
  # NOTE: This demo pipeline exists to show promotion GATING, so the promotion
  # is deliberately credential-free: it only syncs the stage's Argo CD
  # Application and health-checks it. The usual git-clone / yaml-update /
  # git-commit / git-push steps (see bootstrap/kargo/ for the guestbook
  # pipeline) need a Git credential Secret in the 'fanout' project namespace,
  # which does not exist yet.
  promotionTemplate:
    spec:
      steps:
        - uses: argocd-update
          config:
            apps:
              - name: fanout-prod3
