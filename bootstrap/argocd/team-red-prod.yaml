apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-red-prod
  annotations:
    kargo.akuity.io/authorized-stage: "team-red:prod"
spec:
  project: default
  source:
    repoURL: https://github.com/dhpup/akuity-mcp-demo.git
    targetRevision: main
    path: teams/team-red/prod
  destination:
    name: mac1
    namespace: team-red-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
