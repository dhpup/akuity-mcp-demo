apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-blue-prod
  annotations:
    kargo.akuity.io/authorized-stage: "team-blue:prod"
spec:
  project: default
  source:
    repoURL: https://github.com/dhpup/akuity-mcp-demo.git
    targetRevision: main
    path: teams/team-blue/prod
  destination:
    name: mac1
    namespace: team-blue-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
