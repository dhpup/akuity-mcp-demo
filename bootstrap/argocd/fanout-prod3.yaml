apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fanout-prod3
  annotations:
    kargo.akuity.io/authorized-stage: "fanout:prod3"
spec:
  project: default
  source:
    repoURL: https://github.com/dhpup/akuity-mcp-demo.git
    targetRevision: main
    path: fanout/prod3
  destination:
    name: mac1
    namespace: fanout-prod3
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
