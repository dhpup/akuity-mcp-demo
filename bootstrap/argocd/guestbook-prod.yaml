apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-prod
  annotations:
    kargo.akuity.io/authorized-stage: "guestbook:prod"
spec:
  project: default
  source:
    repoURL: https://github.com/dhpup/akuity-mcp-demo.git
    targetRevision: main
    path: prod
  destination:
    name: mac1
    namespace: guestbook-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
