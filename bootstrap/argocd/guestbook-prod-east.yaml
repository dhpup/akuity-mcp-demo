apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-prod-east
  annotations:
    kargo.akuity.io/authorized-stage: "guestbook:prod-east"
spec:
  project: default
  source:
    repoURL: https://github.com/dhpup/akuity-mcp-demo.git
    targetRevision: main
    path: prod-east
  destination:
    name: mac1
    namespace: guestbook-prod-east
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
