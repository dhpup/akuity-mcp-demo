apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook
  labels:
    app: guestbook
    team: blue
    env: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guestbook
      team: blue
  template:
    metadata:
      labels:
        app: guestbook
        team: blue
        env: staging
    spec:
      containers:
        - name: guestbook
          image: ghcr.io/akuity/guestbook:v0.0.1
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
